services:
  app:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Administracion de proyectos"
      APP_ENV: local
      APP_KEY: "base64:EIlLmssmfeGuD3BC/tH1VTkwMpGfdpVqfjMeUbDQpCI="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_MX
      BCRYPT_ROUNDS: 4
      LOG_CHANNEL: stack
      LOG_STACK: single
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: administracion_proyectos
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      AUTO_SEED: "true"
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      target: app
    profiles:
      - test
    environment:
      APP_NAME: "Administracion de proyectos"
      APP_ENV: testing
      APP_KEY: "base64:EIlLmssmfeGuD3BC/tH1VTkwMpGfdpVqfjMeUbDQpCI="
      APP_DEBUG: "true"
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_MX
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    command: ["php", "artisan", "test"]

  db:
    image: mariadb:11.8
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: administracion_proyectos
      MARIADB_USER: laravel
      MARIADB_PASSWORD: laravel
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
